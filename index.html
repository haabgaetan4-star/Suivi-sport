<title>Suivi muscu</title>
<style>
:root{--bg:#f3f3f4;--card:#fff;--tx:#141416;--mu:#6c6c72;--ac:#8a0b14;--bd:#e2e2e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#1a1a1d;--tx:#f4f4f5;--mu:#9a9aa2;--ac:#d1172b;--bd:#2c2c31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#1a1a1d;--tx:#f4f4f5;--mu:#9a9aa2;--ac:#d1172b;--bd:#2c2c31;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:260px;margin:0 auto;padding:6px 4px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:21px;line-height:1.1}
.tabs button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.add{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.day{font-size:13px;color:var(--mu);text-transform:capitalize;margin:14px 0 6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.it b{display:block}.it span{color:var(--mu);font-size:14px}
.del{border:0;background:none;color:var(--mu);font-size:18px;padding:6px 10px}
.mu{color:var(--mu)}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.seg button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mu)}
svg{width:100%;height:auto;display:block;margin-top:10px}
.hide{display:none}
.bodies{display:flex;gap:6px;justify-content:center}.bodies>div{flex:1;max-width:170px}
.m{fill:var(--mu);fill-opacity:.25;stroke:var(--card);stroke-width:1.5;cursor:pointer}.m.t{fill:var(--ac);fill-opacity:var(--o,1)}.m.sel{stroke:var(--tx);stroke-width:2.5}
.sk{fill:var(--mu);opacity:.2}.ln{fill:none;stroke:var(--tx);stroke-width:.8;opacity:.3;pointer-events:none}
.lbl{text-align:center;font-size:12px;color:var(--mu);margin:6px 0 0}
.ex{cursor:pointer}.ex.on b{color:var(--ac)}
.xh{display:flex;align-items:center;gap:10px}.xh>div:nth-child(2){flex:1}.xh b{display:block}
.ph{width:48px;height:48px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;cursor:pointer;font-size:22px}.ph img{width:100%;height:100%;object-fit:cover}
.rt{margin:10px 0;color:var(--ac);font-size:14px}.rt select{width:auto;padding:4px 8px;margin-left:6px;color:var(--ac);font-weight:700}
.sr{display:grid;grid-template-columns:30px 1fr 62px 62px 40px;gap:6px;align-items:center;padding:4px 2px;font-size:14px}.sr.h{font-size:11px;color:var(--mu)}.sr input{padding:7px;text-align:center}.sr.ok{background:#2f9e4426;border-radius:8px}
.ck{border:0;border-radius:8px;padding:8px;background:var(--bd);color:var(--mu);font:inherit}.sr.ok .ck{background:#2f9e44;color:#fff}
.cd{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px;border-radius:10px}.cd.ok{background:#2f9e4426}.cd.ok .ck{background:#2f9e44;color:#fff}.cd .ck{padding:10px 18px;font-size:18px}.cd .sa{width:auto;margin:0;padding:10px 14px}.cd .cm{width:58px;padding:9px 6px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.ct{flex:1;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sa{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.top{display:flex;gap:10px;align-items:center}.tm{font-size:22px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:15px}.chk input{width:auto}
#live{padding-bottom:70px}
#toast{position:fixed;left:16px;right:16px;bottom:150px;z-index:20;max-width:480px;margin:0 auto;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;text-align:center}#toast.hide{display:none}
.ov{position:fixed;inset:0;z-index:12;background:#0008;display:flex;align-items:flex-end;justify-content:center}.ov.hide{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:sticky;top:-14px;background:var(--bg);padding:4px 0;z-index:1}
.pl{width:40px;height:40px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:26px;line-height:1}
#nw{z-index:14;align-items:center;padding:20px}
.box2{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:360px;max-height:90vh;overflow:auto}
.box2 label{margin-top:12px}
.nph{width:84px;height:84px;margin:12px auto 0;border-radius:14px;background:var(--bg);border:1px dashed var(--mu);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:12px;color:var(--mu);text-align:center;flex-direction:column}.nph img{width:100%;height:100%;object-fit:cover}
.gh2{background:none;color:var(--mu);border:1px solid var(--bd)}
#p1{text-align:center}
#nms .cl{font-size:12px;color:var(--mu);margin:10px 0 4px}#nms .chip{display:inline-block;margin:0 6px 6px 0;padding:7px 11px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px}#nms .chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#wd{width:auto;max-width:200px;margin:0 auto;text-align:center;font-weight:600}
#p1 .add{max-width:300px;margin-left:auto;margin-right:auto;display:block}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh}#home #rts{width:100%}#home #start{width:100%}#p1 .day{text-align:center}
#p1 .top{flex-direction:column;gap:4px}#p1 #wn{text-align:center;font-weight:700}
#p1 #exs .xh{flex-direction:column;text-align:center;position:relative;gap:6px}#p1 #exs .xh .del{position:absolute;top:0;right:0}#p1 #exs .xh span{display:block}
#p1 .cd{justify-content:center}#p1 .ct{flex:none}
#p1 #rts .it{flex-direction:column;text-align:center;position:relative;border-top:0}#p1 #rts .it span{display:block}#p1 #rts .del{position:absolute;top:0;right:0}
#p1 .sr{text-align:center}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-h b{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:11px;color:var(--mu);padding:2px 0}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:50%;background:none;color:var(--tx);font:inherit;font-size:14px;padding:0}
.cal button.td{border-color:var(--mu)}
.cal button.wk{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.cal button.sel{outline:2px solid var(--tx);outline-offset:1px}
#dlg{position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}#dlg.hide{display:none}#dlg .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;width:100%;max-width:360px}#dlg .gh{background:none;color:var(--mu);border:1px solid var(--bd)}
#rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;font-weight:700}#rest.hide{display:none}#rest div{display:flex;gap:6px}#rest button{background:#ffffff40;color:#fff;border:0;border-radius:8px;padding:8px 10px;font:inherit}

body{font-family:"Avenir Next","Avenir",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,.tabs button,.add,.stats b,.day{font-family:"Oswald","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.03em;text-transform:uppercase}
h1{font-size:26px;font-weight:700}.tabs button{font-size:13px}.stats b{font-size:22px;font-weight:600}.day{font-size:14px}
</style></head>
<body><main>
<h1>🏋️ Suivi d’entraînement</h1>
<div class="tabs"><button id="t1" class="on"><span>🏋️</span>Entraînement</button><button id="t2"><span>👤</span>Profil</button></div>

<section id="p1">
 <div id="home">
  <button class="add" id="start">Démarrer un entraînement vide</button>
  <div class="day">Mes routines</div><div id="rts"></div>
  
 </div>
 <div id="live" class="hide">
  <div class="card top"><input id="wn" placeholder="Nom de l’entraînement"><div class="tm" id="tm">0:00</div><div class="mu" id="eb" style="font-size:13px"></div><input type="date" id="wd" aria-label="Date de l’entraînement"></div>
  <div id="exs"></div>
  <button class="add" id="addx">+ Ajouter un exercice</button>
  
  <button class="add" id="fin">Terminer l’entraînement</button>
  <button class="add" id="can" style="background:none;color:var(--mu);border:1px solid var(--bd)">Annuler</button>
 </div>
 <div id="rest" class="hide"><span>Repos <b id="rv">0:00</b></span><div><button id="rm">−30 s</button><button id="rp">+30 s</button><button id="rs">Passer</button></div></div>
 <input type="file" accept="image/*" id="pf" class="hide">
 <div id="toast" class="hide"></div>
 <input type="file" accept="image/*" id="pf2" class="hide">
 <div id="pick" class="ov hide"><div class="sheet"><div class="sh"><button class="del" id="pcl" aria-label="Fermer">✕</button><b>Choisir un exercice</b><button class="pl" id="pnew" aria-label="Créer un exercice">+</button></div><div id="plist"></div></div></div>
 <div id="nw" class="ov hide"><div class="box2"><b id="nt">Nouvel exercice</b>
  <div class="nph" id="nph">📷<br>Photo</div>
  <label for="nn">Nom</label><input id="nn" placeholder="Ex. Développé couché" autocomplete="off">
  <label>Muscles travaillés <span class="mu">(plusieurs possibles)</span></label><div id="nms"></div>
  <div id="nrw"><label for="nr">Temps de repos</label><select id="nr"></select></div>
  <button class="add" id="nsv">Enregistrer l’exercice</button>
  <button class="add gh2" id="ncl">Annuler</button>
 </div></div>
 <div id="dlg" class="hide"><div class="box"><b>Terminer l’entraînement ?</b><p class="mu" id="dm"></p><button class="add" data-fm="h">Enregistrer l’entraînement</button><button class="add" data-fm="r">Enregistrer + créer une routine</button><button class="add gh" data-fm="n">Terminer sans enregistrer</button><button class="add gh" data-fm="c">Reprendre</button></div></div>
</section>

<section id="p2" class="hide">
 <div class="card">
  <button class="add gh2" id="pbtn" style="margin:0 0 10px;width:100%">Période : 7 jours ▾</button>
  <div id="ppan" class="hide" style="display:none;gap:8px;margin:0 0 10px"><select id="pn" aria-label="Nombre"></select><select id="pu" aria-label="Unité"><option value="j">jour(s)</option><option value="s">semaine(s)</option><option value="m">mois</option><option value="a">an(s)</option><option value="all">depuis le premier entraînement</option></select></div>
    <div class="bodies" id="bodies"></div>
  <p class="lbl" id="lbl2">Touche un muscle pour voir tes exercices</p>
  <div class="seg"><button id="ga">Autre / non classé</button></div>
 </div>
 <div class="card" id="calc">
  <div class="cal-h"><button class="del" id="cpv" aria-label="Mois précédent">‹</button><b id="cmo"></b><button class="del" id="cnx" aria-label="Mois suivant">›</button></div>
  <div class="cal" id="cal"></div>
  <div id="cdet"></div>
 </div>
 <div class="card" id="histc"><b>Historique</b><div id="hl"></div></div>
 <div class="card" id="bkc"><b>Mes données</b><p class="mu" style="font-size:13px;margin:4px 0 0">Sauvegarde tes entraînements dans un fichier, ou restaure-les sur un autre appareil.</p>
  <div style="display:flex;gap:8px"><button class="sa" id="bkx" style="width:50%;font-size:13px">⬇ Exporter</button><button class="sa" id="bki" style="width:50%;font-size:13px">⬆ Importer</button></div>
  <input type="file" accept=".json,application/json" id="bkf" class="hide">
  <div id="bkc2" class="hide" style="margin-top:8px"><p class="mu" id="bkm" style="font-size:13px;margin:0"></p><div style="display:flex;gap:8px"><button class="sa" id="bko" style="width:50%;font-size:13px;color:var(--ac)">Remplacer mes données</button><button class="sa" id="bkn" style="width:50%;font-size:13px">Annuler</button></div></div>
 </div>
 <div class="card hide" id="det"><b id="dt"></b><div id="dl"></div></div>
 <div class="card hide" id="gc">
  <select id="exo" class="hide"></select>
  <div class="seg" style="margin-top:0"><button id="m1" class="on">Poids max</button><button id="m2">Volume total</button></div>
  <div id="chart"></div>
 </div>
</section>
</main>

   if(v&&v.entries){data=JSON.parse(JSON.stringify(v));render();return}

  }
 }catch(e){}

}

function renderChart(){
 var names=[...new Set(data.entries.filter(function(e){return gsOf(e).indexOf(grp)>=0}).map(function(e){return e.x}))].sort();
 if(!names.length){$('#exo').innerHTML='';$('#chart').innerHTML='';return}

 $('#exo').value=exo;
 var by={};
 data.entries.filter(function(e){return e.x===exo}).forEach(function(e){
  var v=metric==='w'?e.w:e.s*e.r*e.w;by[e.d]=metric==='w'?Math.max(by[e.d]||0,v):(by[e.d]||0)+v;
 });
 var pts=Object.keys(by).sort().map(function(d){return[d,by[d]]});
 var vals=pts.map(function(p){return p[1]}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);

function durOf(o){var m=num(o.min);return m>0?Math.round(m*60):Math.round(ct(o))}
function ct(o){return (o.acc||0)+(o.st?(Date.now()-o.st)/1000:0)}
function cardioCard(o,i){return '<div class="card"><div class="xh"><div class="ph" data-p="'+esc(o.x)+'">'+thumb(o.x,o.g)+'</div><div><b>'+esc(o.x)+'</b><span class="mu">Cardio</span></div><button class="del" data-rx="'+i+'">✕</button></div><div class="cd'+(o.ok?' ok':'')+'"><span class="ct" data-ct="'+i+'">'+fmtT(ct(o))+'</span><input class="cm" data-cm="'+i+'" inputmode="numeric" placeholder="min" aria-label="Durée en minutes" value="'+esc(o.min||'')+'"><button class="sa" data-tg="'+i+'">'+(o.st?'⏸ Pause':'▶ Démarrer')+'</button><button class="ck" data-cc="'+i+'">✓</button></div></div>'}
var tt=0;function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(function(){t.classList.add('hide')},4000)}
function nOk(){var n=0,p=0;cur.ex.forEach(function(o){if(o.g==='cardio'){if(o.ok)n++;else if(durOf(o)>=1)p++}o.sets.forEach(function(s){if(s.ok)n++;else if(String(s.w).trim()!==''&&String(s.r).trim()!=='')p++})});return[n,p]}
var RESTS=[120,150,180,210,240];
function fmtT(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+('0'+m).slice(-2):m)+':'+('0'+s%60).slice(-2)}
function fmtR(s){return s?(s>=60?Math.floor(s/60)+'min'+(s%60||''):s+'s'):'désactivé'}
function gl(g){var f=GR.filter(function(x){return x[0]===g})[0];return f?f[1]:'Autre'}
function pk2(x){return 'k'+x.toLowerCase().split('').map(function(c){return c.charCodeAt(0).toString(36)}).join('_')}
function thumb(x,g){return ph[pk2(x)]?'<img src="'+ph[pk2(x)]+'" alt="">':zi(zone(g)).replace('width:16px;height:22px;max-width:16px','width:26px;height:36px;max-width:26px').replace('vertical-align:-5px','vertical-align:0')}

async function savePh(){try{localStorage.setItem('muscu_ph',JSON.stringify(ph))}catch(e){}if(refP){try{await refP.set(ph)}catch(e){}}}
function prev(x){var es=data.entries.filter(function(e){return e.x===x}),l='',o=[];es.forEach(function(e){if(e.d>l)l=e.d});es.filter(function(e){return e.d===l}).forEach(function(e){for(var i=0;i<e.s;i++)o.push({w:e.w,r:e.r})});return o}
function mkSets(x,n){var p=prev(x),a=[];for(var i=0;i<Math.max(n||p.length,1);i++)a.push({w:p[i]?p[i].w:'',r:p[i]?p[i].r:'',ok:false});return a}
function startW(t){cur={d:today(),t0:Date.now(),name:t?t.n:'Entraînement',rid:t?t.id:0,ex:t?t.ex.map(function(o){return o.g==='cardio'?{x:o.x,g:o.g,gs:o.gs,acc:0,st:0,ok:false,sets:[]}:{x:o.x,g:o.g,gs:o.gs,rest:o.rest,sets:mkSets(o.x,o.n)}}):[]};saveCur();render()}

function finish(mode){
 if(mode==='n'){cur=null;saveCur();render();return}
 var d=cur.d||today(),n=0,nm=$('#wn').value.trim()||'Entraînement',du=cur.edit?cur.du:Math.round((Date.now()-cur.t0)/1000),wk=cur.edit?cur.wk:cur.t0;
 if(cur.edit){var ek=cur.edit;data.entries=data.entries.filter(function(e){return String(e.wk||('d'+e.d))!==ek})}
 cur.ex.forEach(function(o){if(o.g==='cardio'&&o.ok)data.entries.push({id:Date.now()+n++,d:d,x:o.x,s:1,r:0,w:0,g:'cardio',gs:o.gs,dur:durOf(o),wk:wk,wn:nm,du:du})});
 cur.ex.forEach(function(o){o.sets.forEach(function(s){if(s.ok)data.entries.push({id:Date.now()+n++,d:d,x:o.x,s:1,r:parseInt(s.r),w:num(s.w),g:o.g,gs:o.gs,wk:wk,wn:nm,du:du})})});
 if(mode==='r'&&cur.ex.length){var t={id:cur.rid||Date.now(),n:$('#wn').value.trim()||'Entraînement',ex:cur.ex.map(function(o){return{x:o.x,g:o.g,gs:o.gs,rest:o.rest||0,n:o.sets.length}})};data.routines=(data.routines||[]).filter(function(r){return r.id!==t.id});data.routines.push(t)}
 cur=null;saveCur();save();render();
}
